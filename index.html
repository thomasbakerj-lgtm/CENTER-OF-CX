    <!-- Shared accessibility baseline (docs/VISUAL_AUDIT.md, section 1). Controls take
         the page font instead of the browser default; touch screens get 44px targets;
         keyboard focus is always visible, even where a component sets outline: none. -->
    <style>
      button, input, select, textarea { font-family: inherit; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      :focus-visible { outline: 2px solid #0072BC !important; outline-offset: 2px; }
      @media (pointer: coarse) {
        button:not(.stepper):not(.infodot), select, [role="button"],
        input:not([type="checkbox"]):not([type="radio"]):not([type="range"]) { min-height: 44px; }
        .stepper { display: none !important; }
        .infodot { position: relative; }
        .infodot::after { content: ""; position: absolute; inset: -15px; }
      }
    </style>
